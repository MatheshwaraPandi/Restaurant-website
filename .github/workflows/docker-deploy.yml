
name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify files
        run: ls -la

      - name: Build Docker image
        run: docker build -t restaurant-site:latest .

      - name: Save Docker image
        run: docker save restaurant-site:latest | gzip > restaurant-site.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: restaurant-site.tar.gz
          target: /home/ubuntu

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load < restaurant-site.tar.gz
            docker stop restaurant-site || true
            docker rm restaurant-site || true
            docker run -d \
              --restart unless-stopped \
              --name restaurant-site \
              -p 80:80 \
              restaurant-site:latest
