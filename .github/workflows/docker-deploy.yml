name: Docker CI/CD (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restaurant-site:latest .

      - name: Stop old container
        run: |
          docker stop restaurant-site || true
          docker rm restaurant-site || true

      - name: Run new container
        run: |
          docker run -d \
            --restart unless-stopped \
            --name restaurant-site \
            -p 80:80 \
            restaurant-site:latest

